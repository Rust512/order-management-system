name: Build and Test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: corretto
          cache: maven

      - name: Grant executable permission to Maven wrapper
        run: chmod +x mvnw
        continue-on-error: true
      
      - name: verify formatting
        run: ./mvnw spotless:check

      - name: run unit tests
        run: ./mvnw clean test
        
      - name: Cache Docker Images
        id: cache-docker
        uses: actions/cache@v6
        with:
          path: ~/.testcontainers-cache
          # Invalidates cache when dependencies change, or weekly to avoid stale images
          key: ${{ runner.os }}-testcontainers-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-testcontainers-${{ hashFiles('**/pom.xml') }}-
            ${{ runner.os }}-testcontainers-

      - name: Load Cached Docker Images
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: |
          if [ -f ~/.testcontainers-cache/images.tar ]; then
          echo "Loading cached images..."
          docker load -i ~/.testcontainers-cache/images.tar
          fi

      - name: run integration tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
        run: ./mvnw failsafe:integration-test
        
      - name: Save Docker Images to Cache
        # Only save on the main branch or PR updates to prevent redundant uploads
        if: always() && steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.testcontainers-cache
          # Dynamically finds all active Testcontainers images (ignoring Ryuk as it isn't needed for the cache)
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "ryuk" || true)
          if [ ! -z "$IMAGES" ]; then
            echo "Caching images: $IMAGES"
            docker save -o ~/.testcontainers-cache/images.tar $IMAGES
          else
            echo "No Testcontainers images found to cache."
          fi

      - name: Upload JaCoCo coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: |
            target/site/jacoco/
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 5